# Site nginx de l'hote, a placer dans /etc/nginx/sites-available/hub
# puis a lier depuis sites-enabled/. GDA Hub a deja sa propre passerelle
# interne (voir gateway/nginx.conf) qui route tout en interne ; ce fichier
# ne fait que relier le domaine public au port 8080 publie par le
# conteneur "gateway".
#
# Version en clair, utilisee au premier deploiement, avant que le domaine
# ne resolve. Une fois le DNS en place :
#
#   certbot --nginx -d hub.gdamali.net -d www.hub.gdamali.net
#
# certbot ajoute lui-meme l'ecoute en 443, les certificats et la
# redirection depuis le port 80.

server {
    listen 80;
    listen [::]:80;
    server_name hub.gdamali.net www.hub.gdamali.net;

    client_max_body_size 25m;

    access_log /var/log/nginx/hub-acces.log;
    error_log  /var/log/nginx/hub-erreurs.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
