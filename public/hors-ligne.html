<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a130e" />
    <title>Hors ligne — GDA Hub</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
        background: #120d0a url('/motif-orange.jpg') center / cover fixed;
      }
      .carte {
        max-width: 360px; width: 100%; text-align: center; padding: 28px 24px; border-radius: 24px;
        background: rgba(26, 19, 14, 0.82); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px);
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #c9b8ab; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: block; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px;
        background: #ff6a2b; color: #000; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="carte">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>GDA Hub a besoin d'Internet pour afficher vos données à jour. Vérifiez votre connexion, puis réessayez.</p>
      <a href="/">Réessayer</a>
    </div>
  </body>
</html>
