# Service des fichiers déposés par les utilisateurs (inclus dans chaque
# location /media/* et /campagnes/storage/).
#
# Un fichier déposé n'est jamais une page du hub. Même si un dépôt laissait
# passer un .html ou un .svg piégé, il ne doit pas pouvoir s'exécuter sur
# l'origine du hub (XSS stockée, OWASP A03) :
#  - seuls images, PDF et texte gardent leur type ; tout le reste part en
#    application/octet-stream, que le navigateur télécharge sans l'afficher ;
#  - la CSP « sandbox » neutralise scripts et formulaires même affichés.
# Les en-têtes de sécurité du serveur sont repris ici : nginx ne les hérite
# plus dès qu'une location déclare ses propres add_header.
types {
    image/jpeg      jpg jpeg;
    image/png       png;
    image/gif       gif;
    image/webp      webp;
    application/pdf pdf;
    text/plain      txt csv;
}
default_type application/octet-stream;

add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $entete_hsts always;
add_header Cache-Control "private, no-store" always;
