# Les en-tetes que tout mandataire doit poser.
#
# **Pourquoi un fichier separe.** Des qu'un bloc `location` declare un seul
# `proxy_set_header`, nginx cesse d'heriter de *tous* ceux du bloc `server`.
# L'en-tete `Host` disparait alors, nginx le remplace par le nom de l'amont —
# « bdm_app » — et Django rejette la requete : « Invalid HTTP_HOST header ».
#
# Ce fichier est donc inclus dans chaque location qui pose un en-tete a elle.

# `$http_host` et non `$host` : le second retire le port, et Django compare
# l'en-tete Origin (« http://localhost:8080 ») a l'hote de la requete. Sans le
# port, toute soumission de formulaire echoue sur la protection CSRF.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
