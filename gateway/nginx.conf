# Passerelle de GDA Hub.
#
# Elle donne au navigateur une seule origine : http://localhost:8080.
# L'interface et les quatre backends sont derriere, sur le reseau Docker, et
# aucun n'est joignable directement en production.
#
# Le decoupage est simple, et c'est voulu :
#
#   /              l'interface unique (React/Vite, virtus-dashboard) : toutes les vues, toutes les apps
#   /api/<code>/   le backend de chaque application
#   /campagnes/    Campagnes, qui sert encore ses propres pages (Inertia)
#   /media/<code>/ les fichiers deposes, servis depuis les volumes
#
# Une origine unique supprime le CORS, et le jour ou un service est deplace,
# c'est une ligne a changer ici plutot qu'un deploiement de l'interface.

# --- Le compte unique -------------------------------------------------------
#
# Les backends rassembles ne savent pas aller chercher un jeton chez le hub.
# La passerelle fait le pont : elle lit le cookie pose par « identity » a la
# connexion et le presente comme un en-tete « Authorization ».
#
# Le cookie reste HttpOnly : aucun script de page ne le voit.
#
# **L'en-tete du client prime toujours.** Une application ouverte seule, avec
# sa propre connexion, envoie son propre jeton : l'ecraser la deconnecterait.
# Le cookie ne sert que lorsque le client n'a rien presente.
map $cookie_gdahub_acces $autorisation_du_hub {
    default  "Bearer $cookie_gdahub_acces";
    ""       "";
}
map $http_authorization $autorisation {
    default  $http_authorization;
    ""       $autorisation_du_hub;
}

upstream identity  { server identity:8000; }
upstream financerh { server financerh:8000; }
upstream jusorange { server jusorange:8000; }
upstream chantiers { server chantiers:8000; }
upstream planning  { server planning:8000; }
upstream campagnes { server campagnes:8000; }
upstream interface { server frontend:3000; }

server {
    listen 80;
    server_name _;

    # Les exports et les photos passent par la ; la limite par defaut de nginx
    # (1 Mo) est trop basse pour eux.
    client_max_body_size 25m;

    # Les redirections que nginx fabrique lui-meme restent relatives.
    #
    # Par defaut il les rend absolues a partir de « $host », qui ne porte pas
    # le port : « /campagnes » renvoyait vers « http://localhost/campagnes/ »,
    # sans le 8080, et le navigateur tombait sur une connexion refusee. Une
    # adresse relative est resolue par le navigateur contre l'origine
    # courante, port compris.
    absolute_redirect off;

    proxy_http_version 1.1;
    include /etc/nginx/entetes-proxy.conf;
    proxy_read_timeout 120s;

    # --- Les API ------------------------------------------------------------
    #
    # La barre oblique finale du proxy_pass retire le prefixe : chaque Django
    # ignore tout du chemin sous lequel il est servi.

    # Identity monte ses routes sous « /api/identity/ » : contrairement aux
    # autres, son prefixe n'est pas retire. Le retirer lui ferait chercher
    # « /api/auth/connexion », qui n'existe pas chez lui.
    location /api/identity/ {
        proxy_pass http://identity;
        include /etc/nginx/entetes-proxy.conf;
    }

    # FinanceRH est le seul service a heberger deux domaines dans un seul
    # Django (RH et Finance) : il monte donc ses routes sous « /api/rh/ » et
    # « /api/finance/ », comme identity sous « /api/identity/ ». Retirer le
    # prefixe ici (comme pour chantiers/planning/jus, mono-domaine) lui ferait
    # chercher « /api/demandes-absence/... », qui n'existe pas chez lui.
    location /api/rh/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/finance/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # L'authentification propre a FinanceRH (accounts.urls : connexion,
    # profil, rafraichissement) est partagee par ses deux domaines RH et
    # Finance, donc montee cote Django sous « /api/ » plutot que sous l'un ou
    # l'autre — sans cette route, ces trois adresses ne repondaient nulle
    # part et l'ecran d'ouverture de RH restait bloque indefiniment.
    location /api/auth/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/jus/ {
        proxy_pass http://jusorange/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/chantiers/ {
        proxy_pass http://chantiers/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/planning/ {
        proxy_pass http://planning/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # --- Campagnes -----------------------------------------------------------
    #
    # Campagnes sert encore ses propres pages, par Inertia : elle n'a pas
    # d'API et ses vues ne sont pas encore dans l'interface unique. Le
    # prefixe est retire ici et rendu a Django par FORCE_SCRIPT_NAME, qui le
    # remet en fabriquant ses adresses. Laisser le prefixe le ferait compter
    # deux fois. BDM (la banque) n'est qu'un des clients de cette application,
    # d'ou le nom du service.
    location /campagnes/ {
        proxy_pass http://campagnes/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }
    # 307 et non 308 : un navigateur retient une redirection permanente pour
    # toujours, et il n'y a aucun moyen de la lui reprendre a distance. Quand
    # celle-ci pointait encore vers une adresse sans port, elle restait gravee
    # dans le navigateur bien apres la correction du serveur. Un detail de
    # routage ne merite pas d'etre permanent.
    location = /campagnes { return 307 /campagnes/; }

    location /campagnes/static/  { alias /var/statiques/campagnes/; access_log off; }
    location /campagnes/storage/ { alias /var/media/campagnes/;     access_log off; }

    # --- Les fichiers deposes -----------------------------------------------
    #
    # Servis depuis les volumes plutot que par Django : celui-ci ne sert les
    # fichiers qu'en mode debogage, et une piece justificative qui disparait
    # en production serait un defaut invisible.
    location /media/rh/  { alias /var/media/rh/;  access_log off; }
    location /media/jus/ { alias /var/media/jus/; access_log off; }
    location /media/chantiers/ { alias /var/media/chantiers/; access_log off; }
    location /media/planning/ { alias /var/media/planning/; access_log off; }
    # identity sert « hub » comme code d'application (GDAHUB_APPLICATION) :
    # ses photos de profil vivent donc sous /media/hub/, pas /media/identity/.
    location /media/hub/ { alias /var/media/identity/; access_log off; }

    # --- L'administration de Django -----------------------------------------
    location /admin/  { proxy_pass http://identity; }
    location /static/ { proxy_pass http://identity; }

    location /.well-known/jwks.json { proxy_pass http://identity; }

    # --- Les sondes de vie --------------------------------------------------
    #
    # Une par service, sous la meme forme : la supervision n'a pas a connaitre
    # les conventions internes de chacun. Chaque sonde interroge sa base ; un
    # processus vivant mais coupe de sa base repond 503, pas 200.
    location = /sante/identity { proxy_pass http://identity/sante; }
    location = /sante/jus      { proxy_pass http://jusorange/sante; }
    location = /sante/rh       { proxy_pass http://financerh/api/sante/; }
    location = /sante/chantiers { proxy_pass http://chantiers/api/sante/; }
    location = /sante/planning { proxy_pass http://planning/api/sante/; }
    location = /sante/campagnes { proxy_pass http://campagnes/sante; }

    # --- Tout le reste : l'interface ----------------------------------------
    #
    # En dernier, parce que c'est le cas general : toute adresse qui n'est ni
    # une API, ni un fichier, ni Campagnes est une page de l'interface.
    location / {
        proxy_pass http://interface;
        include /etc/nginx/entetes-proxy.conf;
        # Le rechargement a chaud de Next passe par une liaison persistante.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
