# Passerelle de GDA Hub.
#
# Elle donne au navigateur une seule origine : http://localhost:8080.
# L'interface et les quatre backends sont derriere, sur le reseau Docker, et
# aucun n'est joignable directement en production.
#
# Le decoupage est simple, et c'est voulu :
#
#   /              l'interface unique (React/Vite, virtus-dashboard) : toutes les vues, toutes les apps
#   /api/<code>/   le backend de chaque application
#   /campagnes/    Campagnes, qui sert encore ses propres pages (Inertia)
#   /media/<code>/ les fichiers deposes, servis depuis les volumes
#
# Une origine unique supprime le CORS, et le jour ou un service est deplace,
# c'est une ligne a changer ici plutot qu'un deploiement de l'interface.

# --- Le compte unique -------------------------------------------------------
#
# Les backends rassembles ne savent pas aller chercher un jeton chez le hub.
# La passerelle fait le pont : elle lit le cookie pose par « identity » a la
# connexion et le presente comme un en-tete « Authorization ».
#
# Le cookie reste HttpOnly : aucun script de page ne le voit.
#
# **L'en-tete du client prime toujours.** Une application ouverte seule, avec
# sa propre connexion, envoie son propre jeton : l'ecraser la deconnecterait.
# Le cookie ne sert que lorsque le client n'a rien presente.
map $cookie_gdahub_acces $autorisation_du_hub {
    default  "Bearer $cookie_gdahub_acces";
    ""       "";
}
map $http_authorization $autorisation {
    default  $http_authorization;
    ""       $autorisation_du_hub;
}

# --- Sécurité ----------------------------------------------------------------

# Ne pas annoncer la version de nginx.
server_tokens off;

# Adresse réelle du navigateur. En production, la passerelle n'écoute que sur
# 127.0.0.1 derrière le nginx du VPS, qui pose X-Forwarded-For : sans cela,
# toutes les requêtes sembleraient venir de la même adresse et la limite de
# tentatives de connexion bloquerait tout le monde à la fois.
map $http_x_forwarded_for $cle_limite {
    ~^(?<premiere>[^,\s]+) $premiere;
    default                $remote_addr;
}
# Tentatives de connexion : 10 par minute et par adresse, avec une rafale de
# 10. S'ajoute à la limite d'identity lui-même.
limit_req_zone $cle_limite zone=connexion:10m rate=10r/m;

# Protocole d'origine : https derrière le nginx du VPS. L'écraser par
# « http » ferait croire aux services que la connexion n'est pas chiffrée.
map $http_x_forwarded_proto $protocole_origine {
    default   $http_x_forwarded_proto;
    ""        $scheme;
}
# HSTS seulement quand la page a réellement été servie en https.
map $protocole_origine $entete_hsts {
    https     "max-age=31536000; includeSubDomains";
    default   "";
}

# Fichiers déposés : quelles habilitations ouvrent quel dossier. Contrôlé
# par identity avant chaque fichier (voir /_verifier_fichier plus bas).
map $request_uri $applications_fichier {
    ~^/media/rh/          "rh,finance,direction,organisation";
    ~^/media/jus/         "orange";
    ~^/media/chantiers/   "daily";
    ~^/media/planning/    "planning";
    ~^/campagnes/storage/ "campagnes";
    default               "";
}

# Les conteneurs changent d'adresse IP a chaque recreation (« up -d
# --build ») : sans resolution dynamique, nginx garde les anciennes et
# repond 502 jusqu'a son propre redemarrage. Le DNS interne de Docker est
# reinterroge toutes les 10 secondes (« resolve » des upstreams).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream identity { zone amont_identity 64k; server identity:8000 resolve; }
upstream financerh { zone amont_financerh 64k; server financerh:8000 resolve; }
upstream jusorange { zone amont_jusorange 64k; server jusorange:8000 resolve; }
upstream chantiers { zone amont_chantiers 64k; server chantiers:8000 resolve; }
upstream planning { zone amont_planning 64k; server planning:8000 resolve; }
upstream campagnes { zone amont_campagnes 64k; server campagnes:8000 resolve; }
upstream interface { zone amont_interface 64k; server frontend:3000 resolve; }

server {
    listen 80;
    server_name _;

    # Les exports et les photos passent par la ; la limite par defaut de nginx
    # (1 Mo) est trop basse pour eux.
    client_max_body_size 25m;

    # Les redirections que nginx fabrique lui-meme restent relatives.
    #
    # Par defaut il les rend absolues a partir de « $host », qui ne porte pas
    # le port : « /campagnes » renvoyait vers « http://localhost/campagnes/ »,
    # sans le 8080, et le navigateur tombait sur une connexion refusee. Une
    # adresse relative est resolue par le navigateur contre l'origine
    # courante, port compris.
    absolute_redirect off;

    proxy_http_version 1.1;
    include /etc/nginx/entetes-proxy.conf;
    proxy_read_timeout 120s;

    # En-têtes de sécurité, sur toutes les réponses (y compris les erreurs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security $entete_hsts always;

    # --- Accès fermés ------------------------------------------------------
    #
    # La connexion et les droits passent uniquement par le hub (identity).
    # Les connexions propres aux applications, héritées du temps où elles
    # tournaient seules, sont fermées ici : leur code reste, pour une
    # application ouverte hors du hub, mais la passerelle ne les sert plus.

    # Administration Django d'identity : l'administration du hub a son
    # interface (/administration) ; l'admin Django n'offrait qu'une cible de
    # plus aux attaques par force brute.
    # Route interne d'identity (notifications demandées par les services) :
    # appelée sur le réseau Docker, jamais depuis l'extérieur.
    location /api/identity/interne/ { return 404; }
    location /admin/  { return 404; }
    location /static/ { return 404; }

    location = /api/auth/connexion/    { return 404; }
    location = /api/auth/refresh/      { return 404; }
    location = /api/auth/verifier/     { return 404; }
    location = /api/auth/mot-de-passe/ { return 404; }
    location = /api/jus/auth/login/    { return 404; }
    location /campagnes/forgot-password  { return 404; }
    location /campagnes/reset-password   { return 404; }
    location /campagnes/confirm-password { return 404; }
    location = /campagnes/password       { return 404; }
    location = /campagnes/register       { return 404; }
    # L'écran de connexion de Campagnes reste affichable (il sert de page
    # d'accès refusé), mais n'accepte plus de mot de passe.
    location = /campagnes/login {
        limit_except GET HEAD { deny all; }
        proxy_pass http://campagnes/login;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # Connexion au hub : limitée par adresse (voir limit_req_zone).
    location = /api/identity/auth/connexion {
        limit_req zone=connexion burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://identity;
        include /etc/nginx/entetes-proxy.conf;
    }

    # Contrôle d'accès des fichiers déposés : identity vérifie le jeton du
    # hub et l'habilitation à l'application propriétaire du dossier.
    location = /_verifier_fichier {
        internal;
        proxy_pass http://identity/api/identity/auth/verifier-fichier;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $autorisation;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Applications $applications_fichier;
    }

    # --- Les API ------------------------------------------------------------
    #
    # La barre oblique finale du proxy_pass retire le prefixe : chaque Django
    # ignore tout du chemin sous lequel il est servi.

    # Identity monte ses routes sous « /api/identity/ » : contrairement aux
    # autres, son prefixe n'est pas retire. Le retirer lui ferait chercher
    # « /api/auth/connexion », qui n'existe pas chez lui.
    location /api/identity/ {
        proxy_pass http://identity;
        include /etc/nginx/entetes-proxy.conf;
    }

    # FinanceRH est le seul service a heberger deux domaines dans un seul
    # Django (RH et Finance) : il monte donc ses routes sous « /api/rh/ » et
    # « /api/finance/ », comme identity sous « /api/identity/ ». Retirer le
    # prefixe ici (comme pour chantiers/planning/jus, mono-domaine) lui ferait
    # chercher « /api/demandes-absence/... », qui n'existe pas chez lui.
    location /api/rh/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/finance/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # L'authentification propre a FinanceRH (accounts.urls : connexion,
    # profil, rafraichissement) est partagee par ses deux domaines RH et
    # Finance, donc montee cote Django sous « /api/ » plutot que sous l'un ou
    # l'autre — sans cette route, ces trois adresses ne repondaient nulle
    # part et l'ecran d'ouverture de RH restait bloque indefiniment.
    location /api/auth/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # Meme routeur DRF que /api/auth/ (accounts.urls, montees sous « /api/ »
    # cote Django) : l'annuaire et les departements vivent hors des domaines
    # RH/Finance, donc hors de /api/rh/ et /api/finance/ ci-dessus. Sans ces
    # deux routes, ces adresses tombaient sur le fourre-tout du frontend
    # (200, page HTML) au lieu de l'API — l'annuaire RH plantait au
    # decodage JSON.
    location /api/utilisateurs/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/departements/ {
        proxy_pass http://financerh;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/jus/ {
        proxy_pass http://jusorange/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/chantiers/ {
        proxy_pass http://chantiers/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    location /api/planning/ {
        proxy_pass http://planning/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # --- Campagnes -----------------------------------------------------------
    #
    # Campagnes sert encore ses propres pages, par Inertia : elle n'a pas
    # d'API et ses vues ne sont pas encore dans l'interface unique. Le
    # prefixe est retire ici et rendu a Django par FORCE_SCRIPT_NAME, qui le
    # remet en fabriquant ses adresses. Laisser le prefixe le ferait compter
    # deux fois. BDM (la banque) n'est qu'un des clients de cette application,
    # d'ou le nom du service.
    location /campagnes/ {
        proxy_pass http://campagnes/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }
    # 307 et non 308 : un navigateur retient une redirection permanente pour
    # toujours, et il n'y a aucun moyen de la lui reprendre a distance. Quand
    # celle-ci pointait encore vers une adresse sans port, elle restait gravee
    # dans le navigateur bien apres la correction du serveur. Un detail de
    # routage ne merite pas d'etre permanent.
    location = /campagnes { return 307 /campagnes/; }

    location /campagnes/static/  { alias /var/statiques/campagnes/; access_log off; }
    location /campagnes/storage/ { auth_request /_verifier_fichier; alias /var/media/campagnes/; access_log off; }

    # --- Les fichiers deposes -----------------------------------------------
    #
    # Servis depuis les volumes plutot que par Django : celui-ci ne sert les
    # fichiers qu'en mode debogage, et une piece justificative qui disparait
    # en production serait un defaut invisible.
    location /media/rh/ { auth_request /_verifier_fichier; alias /var/media/rh/; access_log off; }
    location /media/jus/ { auth_request /_verifier_fichier; alias /var/media/jus/; access_log off; }
    location /media/chantiers/ { auth_request /_verifier_fichier; alias /var/media/chantiers/; access_log off; }
    location /media/planning/ { auth_request /_verifier_fichier; alias /var/media/planning/; access_log off; }
    # identity sert « hub » comme code d'application (GDAHUB_APPLICATION) :
    # ses photos de profil vivent donc sous /media/hub/, pas /media/identity/.
    location /media/hub/ { auth_request /_verifier_fichier; alias /var/media/identity/; access_log off; }

    location /.well-known/jwks.json { proxy_pass http://identity; }

    # --- Les sondes de vie --------------------------------------------------
    #
    # Une par service, sous la meme forme : la supervision n'a pas a connaitre
    # les conventions internes de chacun. Chaque sonde interroge sa base ; un
    # processus vivant mais coupe de sa base repond 503, pas 200.
    location = /sante/identity { proxy_pass http://identity/sante; }
    location = /sante/jus      { proxy_pass http://jusorange/sante; }
    location = /sante/rh       { proxy_pass http://financerh/api/sante/; }
    location = /sante/chantiers { proxy_pass http://chantiers/api/sante/; }
    location = /sante/planning { proxy_pass http://planning/api/sante/; }
    location = /sante/campagnes { proxy_pass http://campagnes/sante; }

    # --- Tout le reste : l'interface ----------------------------------------
    #
    # En dernier, parce que c'est le cas general : toute adresse qui n'est ni
    # une API, ni un fichier, ni Campagnes est une page de l'interface.
    location / {
        proxy_pass http://interface;
        include /etc/nginx/entetes-proxy.conf;
        # Le rechargement a chaud de Next passe par une liaison persistante.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
