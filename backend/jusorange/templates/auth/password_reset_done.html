<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email envoyé - JusOrange GDA</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'auth_screens/style.css' %}?v=3">
    <style>
        .auth-simple { max-width: 420px; margin: 40px auto; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; }
        .auth-simple h1 { font-size: 24px; margin-bottom: 16px; }
        .auth-simple p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .auth-simple a { color: #FF6A3A; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    {% if messages %}
    <div style="max-width: 420px; margin: 20px auto 0;">
        {% for message in messages %}
        <div style="padding: 12px; border-radius: 8px; margin-bottom: 12px; background: #d4edda; color: #155724;">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    <div class="auth-simple">
        <h1>Email envoyé</h1>
        <p>Si un compte existe avec cette adresse email, vous recevrez un lien pour réinitialiser votre mot de passe. Vérifiez votre boîte de réception.</p>
        <a href="{% url 'login' %}">Retour à la connexion</a>
    </div>
</body>
</html>
